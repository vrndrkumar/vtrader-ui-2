# /etc/nginx/sites-available/vtrader.in
# Symlink: ln -s /etc/nginx/sites-available/vtrader.in /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name vtrader.in www.vtrader.in;

    # Redirect all HTTP → HTTPS
    return 301 https://vtrader.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vtrader.in www.vtrader.in;

    # ── SSL certificates (update paths if you use Certbot/Let's Encrypt) ──
    ssl_certificate     /etc/letsencrypt/live/vtrader.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vtrader.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Document root ──
    root  /home/vtrader/vtrader-ui;
    index index.html;

    # ── SPA routing: all paths fall back to index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache hashed assets forever (Vite fingerprints them) ──
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Never cache index.html (so new deploys take effect immediately) ──
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # ── Gzip ──
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    application/atom+xml image/svg+xml;

    # ── Security headers ──
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block" always;
}
