<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="vt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121A2B"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="vt-arm" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#vt-bg)"/>

  <!-- Subtle inner border glow -->
  <rect width="62" height="62" x="1" y="1" rx="15.5" fill="none"
        stroke="rgba(0,229,187,0.18)" stroke-width="1"/>

  <!-- V-mark: Left arm (teal) from (9,11) to (32,52) -->
  <line x1="9"  y1="11" x2="32" y2="52"
        stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>

  <!-- V-mark: Right arm lower — gradient from vertex (32,52) up to trigger (44,32) -->
  <line x1="32" y1="52" x2="44" y2="32"
        stroke="url(#vt-arm)" stroke-width="5" stroke-linecap="round"/>

  <!-- V-mark: Right arm upper — purple, dimmed, from trigger (44,32) to (55,11) -->
  <line x1="44" y1="32" x2="55" y2="11"
        stroke="#7C5CFF" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Price trigger level — horizontal at y=30 through left arm -->
  <!-- Left arm at y=30: t=(30-11)/(52-11)=19/41≈0.463 → x=9+0.463*23≈19.6≈20 -->
  <line x1="4"  y1="30" x2="16" y2="30"
        stroke="#FBBF24" stroke-width="2" stroke-dasharray="3.5,2.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="24" y1="30" x2="36" y2="30"
        stroke="#FBBF24" stroke-width="2" stroke-linecap="round" opacity="0.70"/>

  <!-- Execution circle at (20,30) on left arm -->
  <circle cx="20" cy="30" r="7"   fill="#FBBF24" fill-opacity="0.12"/>
  <circle cx="20" cy="30" r="4"   fill="#FBBF24"/>
  <circle cx="18.8" cy="28.8" r="1.2" fill="white" opacity="0.85"/>
</svg>
